<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Hub - OS</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#1e293b',
                        darkpanel: '#334155',
                        darkborder: '#475569',
                    }

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Quill Editor (Rich Text) -->

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; transition: background-color 0.3s, color 0.3s; }
        .panel { border-radius: 12px; overflow: hidden; transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
        .panel-hover:hover { transform: translateY(-2px); cursor: pointer; }
        
        /* Checkbox circolare per tasks in stile reference */
        .task-checkbox { appearance: none; min-width: 1.25rem; width: 1.25rem; height: 1.25rem; border: 2px solid; border-radius: 50%; cursor: pointer; position: relative; transition: all 0.2s; background: transparent; }
        .dark .task-checkbox { border-color: #64748b; }
        .task-checkbox:checked { background-color: #f59e0b !important; border-color: #f59e0b !important; }
        .task-checkbox:checked::after { content: '✔'; position: absolute; color: white; font-size: 10px; top: 0px; left: 4px; font-weight: bold; }
        
        .draggable { cursor: grab; }
        .draggable:active { cursor: grabbing; }
        .drag-over { border: 2px dashed #60a5fa !important; opacity: 0.5; border-radius: 8px;}

        .word-wrap { overflow-wrap: break-word; word-wrap: break-word; word-break: break-word; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .input-base { width: 100%; border-radius: 8px; padding: 0.5rem 0.75rem; font-size: 0.875rem; transition: all 0.2s; outline: none; border: 1px solid; }
        .dark .input-base { background-color: #1e293b; border-color: #475569; color: #f8fafc; }
        .input-base { background-color: #f8fafc; border-color: #e2e8f0; color: #0f172a; }
        .dark .input-base:focus { border-color: #60a5fa; box-shadow: 0 0 0 1px #60a5fa; }
        .input-base:focus { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; }
        
        /* Stile menu a tendina laterale */
        .tm-nav-item { padding: 0.6rem 0.8rem; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; font-weight: 600; color: #475569; }
        .dark .tm-nav-item { color: #cbd5e1; }
        .dark .tm-nav-item:hover { background-color: rgba(255,255,255,0.05); }
        .tm-nav-item:hover { background-color: rgba(0,0,0,0.03); }
        .dark .tm-nav-item.active { background-color: rgba(59, 130, 246, 0.15); color: #93c5fd; }
        .tm-nav-item.active { background-color: #e0f2fe; color: #0284c7; }

        .ql-toolbar.ql-snow { border: none !important; border-bottom: 1px solid #e2e8f0 !important; background: transparent; padding: 8px 0 !important; }
        .dark .ql-toolbar.ql-snow { border-bottom-color: #475569 !important; }
        .ql-container.ql-snow { border: none !important; font-family: inherit; font-size: 14px; padding: 0.5rem 0; line-height: 1.6; }
        .dark .ql-snow .ql-stroke { stroke: #cbd5e1; }
        .dark .ql-snow .ql-fill, .dark .ql-snow .ql-stroke.ql-fill { fill: #cbd5e1; }
        .dark .ql-snow .ql-picker { color: #cbd5e1; }
        
        .glass-header { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .dark .glass-header { background: rgba(30, 41, 59, 0.8); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-header { background: rgba(255, 255, 255, 0.8); border-bottom: 1px solid rgba(0,0,0,0.05); }
        
        /* --- SIDEBAR MOBILE TASK MANAGER --- */
        .tm-sidebar-mobile { position: fixed; top: 0; left: 0; bottom: 0; width: 85%; max-width: 320px; z-index: 50; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
        .tm-sidebar-mobile.open { transform: translateX(0); }
        .tm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(2px); }
        .tm-overlay.open { opacity: 1; pointer-events: auto; }

        @media (min-width: 768px) {
            .tm-sidebar-mobile { position: static; transform: none; width: 16rem; box-shadow: none; z-index: auto; }
            .tm-overlay { display: none; }
        }

        #mobileNotesModal { z-index: 60; }
        .mobile-ql-container { height: calc(100vh - 140px); overflow-y: auto; }
    </style>
</head>

    <script>
        // --- TEMA ---
        function applyTheme() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            render(); 
        }
        applyTheme();

        // --- MOTORE DATI (DATA MANAGER) ---
        class LifeHubDataManager {
            constructor() {
                this.token = localStorage.getItem('hub_gh_token') || '';
                this.gistId = localStorage.getItem('hub_gist_id') || '';
                this.saveTimeout = null;
                this.isSyncing = false;
                
                this.defaultData = {
                    version: "5.0",
                    spheres: [], projects: [], subprojects: [], tasks: [], contacts: []
                };
                
                this.data = JSON.parse(JSON.stringify(this.defaultData));
            }

            isConfigured() { return this.token.length > 0 && this.gistId.length > 0; }

            async initialize() {
                if (!this.isConfigured()) {
                    this.loadLocal();
                    return;
                }
                const btn = document.getElementById('syncBtn');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin text-base"></i>';
                
                try {
                    const res = await fetch(`https://api.github.com/gists/${this.gistId}`, {
                        headers: { 'Authorization': `Bearer ${this.token}` },
                        cache: 'no-store'
                    });
                    if (!res.ok) throw new Error("Errore API GitHub");
                    const gistData = await res.json();
                    
                    if (gistData.files && gistData.files['life_hub_data.json']) {
                        let parsed = {};
                        let content = gistData.files['life_hub_data.json'].content;
                        if(content && content.trim() !== "" && content.trim() !== "{}") {
                            try { parsed = JSON.parse(content); } catch(e) { console.warn("JSON err", e); }
                        }
                        this.data = this.migrateData(parsed);
                        this.saveLocal(); 
                    }
                    btn.innerHTML = '<i class="fas fa-check text-green-500 text-base"></i>';
                } catch (error) {
                    console.error("Gist Load Error:", error);
                    this.loadLocal(); 
                    btn.innerHTML = '<i class="fas fa-exclamation-triangle text-amber-500 text-base"></i>';
                }
                setTimeout(() => btn.innerHTML = '<i class="fas fa-cloud-sync text-base"></i>', 2000);
                render();
            }

            triggerSave() {
                this.saveLocal();
                if (this.saveTimeout) clearTimeout(this.saveTimeout);
                this.saveTimeout = setTimeout(() => { this.pushToCloud(); }, 2500);
            }

            async pushToCloud() {
                if (!this.isConfigured() || this.isSyncing) return;
                this.isSyncing = true;
                const btn = document.getElementById('syncBtn');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin text-base"></i>';

                try {
                    const res = await fetch(`https://api.github.com/gists/${this.gistId}`, {
                        method: 'PATCH',
                        headers: { 'Authorization': `Bearer ${this.token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ files: { 'life_hub_data.json': { content: JSON.stringify(this.data, null, 2) } } })
                    });
                    if (!res.ok) throw new Error("Patch failed");
                    btn.innerHTML = '<i class="fas fa-check text-green-500 text-base"></i>';
                } catch (error) {
                    console.error("Gist Save Error:", error);
                    btn.innerHTML = '<i class="fas fa-times text-red-500 text-base"></i>';
                } finally {
                    this.isSyncing = false;
                    setTimeout(() => btn.innerHTML = '<i class="fas fa-cloud-sync text-base"></i>', 2000);
                }
            }

            loadLocal() {
                const local = localStorage.getItem('hub_local_data');
                if (local) this.data = this.migrateData(JSON.parse(local));
                else this.data = JSON.parse(JSON.stringify(this.defaultData));
                render();
            }

            saveLocal() { localStorage.setItem('hub_local_data', JSON.stringify(this.data)); }

            migrateData(d) {
                if (!d || Object.keys(d).length === 0) return JSON.parse(JSON.stringify(this.defaultData));
                let n = { version: "5.0", spheres: [], projects: [], subprojects: [], tasks: d.tasks || [], contacts: d.contacts || [] };
                
                if (d.version !== "4.5" && d.version !== "5.0" && d.spheres && d.spheres.length > 0 && d.spheres[0].projects !== undefined) {
                    d.spheres.forEach((s, sIdx) => {
                        n.spheres.push({ id: s.id, name: s.name, icon: s.icon || 'fa-folder', color: mapColor(s.color), order: s.order||sIdx, notes: s.notes||'', permanentNotes: s.permanentNotes||'', updates: s.updates||[] });
                        if (s.projects) {
                            s.projects.forEach((p, pIdx) => {
                                n.projects.push({ id: p.id, sphereId: s.id, name: p.name, icon: p.icon || 'fa-folder', color: p.color, type: p.type, status: p.status, pinned: p.pinned, archived: p.archived||false, notes: p.notes, permanentNotes: p.permanentNotes||'', updates: p.updates||[], startDate: p.startDate||'', endDate: p.endDate||'', order: p.order||pIdx, pinnedOrder: p.pinnedOrder||pIdx });
                                if (p.subprojects) {
                                    p.subprojects.forEach((sp, spIdx) => {
                                        n.subprojects.push({ id: sp.id, projectId: p.id, name: sp.name, icon: sp.icon || 'fa-file-alt', color: sp.color, type: sp.type||'A termine', status: sp.status||'Attivo', pinned: sp.pinned||false, archived: sp.archived||false, notes: sp.notes, permanentNotes: sp.permanentNotes||'', updates: sp.updates||[], startDate: sp.startDate||'', endDate: sp.endDate||'', order: sp.order||spIdx, pinnedOrder: sp.pinnedOrder||spIdx });
                                    });
                                }
                            });
                        }
                    });
                } else {
                    n.spheres = (d.spheres || []).map(s => ({...s, color: mapColor(s.color)}));
                    n.projects = (d.projects || []);
                    n.subprojects = (d.subprojects || []);
                }
                return n;
            }
            
            importJSON(jsonText) {
                const parsed = JSON.parse(jsonText);
                if(parsed.spheres) this.data.spheres.push(...parsed.spheres);
                if(parsed.projects) this.data.projects.push(...parsed.projects);
                if(parsed.subprojects) this.data.subprojects.push(...parsed.subprojects);
                if(parsed.tasks) this.data.tasks.push(...parsed.tasks);
                if(parsed.contacts) this.data.contacts.push(...parsed.contacts);
                this.triggerSave();
            }
            
            reset() {
                this.data = JSON.parse(JSON.stringify(this.defaultData));
                this.triggerSave();
            }
        }

        const AppData = new LifeHubDataManager();

            if(c.includes('amber') || c.includes('yellow')) return '#f59e0b';
            if(c.includes('purple')) return '#a855f7';
            if(c.includes('red')) return '#ef4444';
            if(c.includes('blue')) return '#3b82f6';

        function closeEntityModal() { document.getElementById('entityModal').classList.add('hidden'); }
        
        function saveEntityModal() {
            const name = document.getElementById('emName').value.trim();
            if(!name) return alert("Inserisci un nome valido.");
            
            const baseObj = { name, icon: document.getElementById('emIcon').value, color: document.getElementById('emColor').value };
            let extraObj = {};
            if(editState.type !== 'sphere') {
                extraObj = { type: document.getElementById('emType').value, status: document.getElementById('emStatus').value, startDate: document.getElementById('emStartDate').value, endDate: document.getElementById('emEndDate').value };
            }

            if(editState.mode === 'create') {
                const newId = editState.type.charAt(0) + '_' + Date.now();
                if(editState.type === 'sphere') state.data.spheres.push({ id: newId, ...baseObj, order: state.data.spheres.length, notes: '', permanentNotes: '', updates: [] });
                else if(editState.type === 'project') state.data.projects.push({ id: newId, sphereId: editState.sId, ...baseObj, ...extraObj, pinned: false, archived: false, order: getChildren('sphere', editState.sId).length, notes: '', permanentNotes: '', updates: [] });
                else state.data.subprojects.push({ id: newId, projectId: editState.pId, ...baseObj, ...extraObj, pinned: false, archived: false, order: getChildren('project', editState.pId).length, notes: '', permanentNotes: '', updates: [] });
                
                if(editState.type === 'sphere') navigate('sphere', newId);
                else if(editState.type === 'project') navigate('project', editState.sId, newId);
                else navigate('subproject', editState.sId, editState.pId, newId);
            } else {
                const e = getEntity(editState.type, editState.id);
                if(e) {
                    Object.assign(e, baseObj, extraObj);
                    if(editState.type !== 'sphere') {
                        const newParent = document.getElementById('emParentSelect').value;
                        if(editState.type === 'project' && e.sphereId !== newParent) {
                            e.sphereId = newParent;
                            e.order = getChildren('sphere', newParent).length;
                            if(state.path.projId === e.id) navigate('project', newParent, e.id);
                        } else if(editState.type === 'subproject' && e.projectId !== newParent) {
                            e.projectId = newParent;
                            e.order = getChildren('project', newParent).length;
                            if(state.path.subprojId === e.id) {
                                const targetProj = getEntity('project', newParent);
                                if(targetProj) navigate('subproject', targetProj.sphereId, newParent, e.id);
                            }
                        }
                    }
                }
            }
            closeEntityModal(); AppData.triggerSave(); render();
        }

        function deleteCurrentEntity() {
            if(!confirm("Eliminare definitivamente? Verranno eliminati anche tutti i contenuti all'interno.")) return;
            const id = editState.id;
            if(editState.type === 'sphere') {
                state.data.spheres = state.data.spheres.filter(x => x.id !== id);
                const projs = state.data.projects.filter(x => x.sphereId === id).map(x=>x.id);
                state.data.projects = state.data.projects.filter(x => x.sphereId !== id);
                state.data.subprojects = state.data.subprojects.filter(x => !projs.includes(x.projectId));
                navigate('home');
            } else if(editState.type === 'project') {
                state.data.projects = state.data.projects.filter(x => x.id !== id);
                state.data.subprojects = state.data.subprojects.filter(x => x.projectId !== id);
                navigate('sphere', editState.sId);
            } else {
                state.data.subprojects = state.data.subprojects.filter(x => x.id !== id);
                navigate('project', editState.sId, editState.pId);
            }
            closeEntityModal(); AppData.triggerSave(); render();
        }

        function getChildren(parentType, parentId, sortProp = 'order') {

            if(parentType === 'project') return state.data.subprojects.filter(sp => sp.projectId === parentId).sort((a,b)=>(a[sortProp]||0)-(b[sortProp]||0));

        // --- DRAG & DROP LOGIC ---
        function onDragStart(e, id, type, listType) { dragSource = { id, type, listType }; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => e.target.classList.add('opacity-40'), 0); }
        function onDragEnd(e) { e.target.classList.remove('opacity-40'); document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); dragSource = null; }
        function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if(!e.currentTarget.classList.contains('drag-over')) e.currentTarget.classList.add('drag-over'); }
        function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
        function onDrop(e, targetId, targetType, listType) {
            e.preventDefault(); e.currentTarget.classList.remove('drag-over');
            if(!dragSource || dragSource.listType !== listType) return;
            const srcId = dragSource.id;
            if(srcId === targetId && dragSource.type === targetType) return;

            let list = [];
            const prop = (listType === 'dashboard_pinned') ? 'pinnedOrder' : 'order';

            if(listType === 'dashboard_pinned') list = [...state.data.projects.filter(p=>p.pinned && !p.archived), ...state.data.subprojects.filter(sp=>sp.pinned && !sp.archived)].sort((a,b) => (a.pinnedOrder||0) - (b.pinnedOrder||0));
            else if(listType === 'sphere_pinned') list = state.data.projects.filter(p => p.sphereId === state.path.sphereId && p.pinned && p.archived === state.ui.showArchived).sort((a,b) => (a.order||0) - (b.order||0));
            else if(listType === 'sphere_unpinned') list = state.data.projects.filter(p => p.sphereId === state.path.sphereId && !p.pinned && p.archived === state.ui.showArchived).sort((a,b) => (a.order||0) - (b.order||0));
            else if(listType === 'project_pinned') list = state.data.subprojects.filter(sp => sp.projectId === state.path.projId && sp.pinned && sp.archived === state.ui.showArchived).sort((a,b) => (a.order||0) - (b.order||0));
            else if(listType === 'project_unpinned') list = state.data.subprojects.filter(sp => sp.projectId === state.path.projId && !sp.pinned && sp.archived === state.ui.showArchived).sort((a,b) => (a.order||0) - (b.order||0));
            else if(listType === 'tm_spheres') list = [...state.data.spheres].sort((a,b) => (a.order||0) - (b.order||0));
            else if(listType.startsWith('tm_proj_')) list = state.data.projects.filter(p => p.sphereId === listType.replace('tm_proj_','') && !p.archived).sort((a,b) => (a.order||0) - (b.order||0));
            else if(listType.startsWith('tm_sub_')) list = state.data.subprojects.filter(sp => sp.projectId === listType.replace('tm_sub_','') && !sp.archived).sort((a,b) => (a.order||0) - (b.order||0));

            const draggedIdx = list.findIndex(x => x.id === srcId), targetIdx = list.findIndex(x => x.id === targetId);
            if(draggedIdx === -1 || targetIdx === -1) return;

            const draggedObj = list.splice(draggedIdx, 1)[0];
            list.splice(targetIdx, 0, draggedObj);

            list.forEach((item, index) => {
                if(item.projectId !== undefined) {
                    let obj = state.data.subprojects.find(x => x.id === item.id);
                    if(obj) obj[prop] = index;
                } else if(item.sphereId !== undefined) {
                    let obj = state.data.projects.find(x => x.id === item.id);
                    if(obj) obj[prop] = index;
                } else {
                    let obj = state.data.spheres.find(x => x.id === item.id);
                    if(obj) obj[prop] = index;
                }
            });
            AppData.triggerSave(); render();
        }

        function createDraggableCardHtml(title, sub, type, sId, pId, spId, colorHex, listType, itemObj) {
            const id = type === 'project' ? pId : spId;
            const icon = itemObj.icon || (type === 'project' ? 'fa-folder' : 'fa-file-alt');
            return `
                <div draggable="true" ondragstart="onDragStart(event, '${id}', '${type}', '${listType}')" ondragend="onDragEnd(event)" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, '${id}', '${type}', '${listType}')"
                     onclick="navigate('${type}', '${sId}', '${pId}', '${spId}')" class="panel panel-hover p-3 flex justify-between items-center relative group draggable mb-3 bg-white dark:bg-darkpanel border border-slate-200 dark:border-darkborder shadow-sm border-l-4" style="border-left-color: ${colorHex}">
                    <div class="pl-2 word-wrap flex-1">
                        <h3 class="font-bold text-slate-800 dark:text-slate-100 text-sm flex items-center">
                            ${itemObj.pinned ? '<i class="fas fa-star text-amber-500 text-[10px] mr-1.5"></i>' : ''} <i class="fas ${icon} text-slate-400 dark:text-slate-500 mr-1.5 text-xs"></i> ${title}
                        </h3>
                        <p class="text-[10px] font-bold text-slate-500 mt-1 uppercase tracking-widest">${sub}</p>
                    </div>

                    <div class="w-10 h-10 rounded-full flex items-center justify-center mb-2" style="background-color: ${s.color}20"><i class="fas ${s.icon} text-lg" style="color: ${s.color}"></i></div>
                    <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100">${s.name}</h3>
                </div>`;
            });
            
            let pinnedList = [...state.data.projects.filter(p=>p.pinned && !p.archived), ...state.data.subprojects.filter(sp=>sp.pinned && !sp.archived)].sort((a,b)=>(a.pinnedOrder||0)-(b.pinnedOrder||0));
            pinnedList.forEach(item => {
                if(item.projectId) { 
                    const p = getEntity('project', item.projectId); 
                    const s = p ? getEntity('sphere', p.sphereId) : null;
                    const color = item.color || (p?p.color:null) || (s?s.color:null) || '#94a3b8';
                    const pName = p ? p.name : 'Sconosciuto';
                    pinnedHtml += createDraggableCardHtml(item.name, `${pName} (Sub)`, 'subproject', s?s.id:null, p?p.id:null, item.id, color, 'dashboard_pinned', item);

                    const s = getEntity('sphere', item.sphereId);
                    const color = item.color || (s?s.color:null) || '#94a3b8';
                    const sName = s ? s.name : 'Sconosciuto';

        // --- ENTITY VIEWS & NOTES ---
        function archiveNotes(type, id) {
            const entity = getEntity(type, id);
            if(!entity) return;
            if (!entity.notes || entity.notes.trim() === '' || entity.notes === '<p><br></p>') {
                alert("Il foglio degli appunti è vuoto. Non c'è nulla da archiviare.");
                return;
            }
            if (!entity.updates) entity.updates = [];
            const dStr = new Date().toLocaleDateString('it-IT') + ' - ' + new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});
            
            entity.updates.push({ id: 'u_'+Date.now(), date: dStr, text: entity.notes, edited: false });
            entity.notes = ''; 
            
            const el = document.getElementById(`quill-editor-${type}`);
            if (el && el.__quill) el.__quill.root.innerHTML = '';
            
            AppData.triggerSave(); render();
        }

        function renderArchivedNotes(updates, type, id) {
            if (!updates || updates.length === 0) return '';
            let html = `
                <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-700/50">
                    <h3 class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest flex items-center mb-4"><i class="fas fa-history mr-1.5"></i> Storico Archiviati</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">`;
            updates.slice().reverse().forEach(u => {
                html += `
                    <div onclick="openArchiveModal('${type}', '${id}', '${u.id}')" class="panel p-3 bg-slate-50 dark:bg-[#202938] border border-slate-200 dark:border-darkborder hover:border-blue-500 dark:hover:border-blue-400 cursor-pointer shadow-sm transition group">
                        <i class="far fa-file-alt text-2xl text-slate-300 dark:text-slate-600 mb-2 group-hover:text-blue-500 transition"></i>
                        <p class="font-bold text-xs text-slate-700 dark:text-slate-200">Appunti</p>
                        <p class="text-[9px] font-bold text-slate-500 uppercase tracking-wider mt-1">${u.date.split(' - ')[0]}</p>
                        ${u.edited ? `<p class="text-[8px] text-amber-500 mt-1.5 font-bold"><i class="fas fa-pencil-alt"></i> MODIFICATO</p>` : ''}
                    </div>`;
            });
            return html + `</div></div>`;
        }

        function openArchiveModal(type, entityId, updateId) {
            currentArchiveEdit = { type, entityId, updateId };
            const entity = getEntity(type, entityId);
            if(!entity) return;
            const update = entity.updates.find(u => u.id === updateId);
            
            document.getElementById('archiveViewTitle').innerText = `Archivio - ${entity.name}`;
            document.getElementById('archiveViewDate').innerText = update.date;
            
            if (update.edited) {
                document.getElementById('archiveEditIndicator').classList.remove('hidden');
                document.getElementById('archiveEditIndicator').innerHTML = `<i class="fas fa-pencil-alt mr-1"></i> Modificato il ${update.editDate}`;
            } else {
                document.getElementById('archiveEditIndicator').classList.add('hidden');
            }

            document.getElementById('archiveViewModal').classList.remove('hidden');
            
            if (!archiveQuill) {
                const tOpts = [['bold', 'italic', 'underline', 'strike'], ['blockquote', 'code-block'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], [{ 'color': [] }, { 'background': [] }], ['link'], ['clean']];
                archiveQuill = new Quill('#quill-archive-editor', { theme: 'snow', modules: { toolbar: tOpts } });
            }
            archiveQuill.root.innerHTML = update.text || '';
        }
        
        function closeArchiveModal() { document.getElementById('archiveViewModal').classList.add('hidden'); }
        
        function saveArchiveEdit() {
            const { type, entityId, updateId } = currentArchiveEdit;
            const entity = getEntity(type, entityId);
            if(entity) {
                const update = entity.updates.find(u => u.id === updateId);
                if(update) {
                    update.text = archiveQuill.root.innerHTML;
                    update.edited = true;
                    update.editDate = new Date().toLocaleDateString('it-IT') + ' ' + new Date().toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});
                    AppData.triggerSave(); render();
                }
            }
            closeArchiveModal();
        }

        function initQuillEditors() {
            const tOpts = [['bold', 'italic', 'underline', 'strike'], ['blockquote', 'code-block'], [{ 'list': 'ordered'}, { 'list': 'bullet' }], [{ 'color': [] }, { 'background': [] }], ['link'], ['clean']];
            
            ['sphere', 'project', 'subproject'].forEach(type => {
                const id = type === 'sphere' ? state.path.sphereId : (type === 'project' ? state.path.projId : state.path.subprojId);
                if (!id) return;
                const entity = getEntity(type, id);
                if(!entity) return;

                if (type !== 'sphere') {
                    const el = document.getElementById(`quill-editor-${type}`);
                    if (el) {
                        el.__quill = new Quill(el, { theme: 'snow', modules: { toolbar: tOpts }, placeholder: 'Inizia a scrivere nel foglio libero...' });
                        el.__quill.root.innerHTML = entity.notes || '';
                        el.__quill.on('text-change', function(delta, oldDelta, source) { 
                            if (source === 'user') {
                                entity.notes = el.__quill.root.innerHTML; 
                                AppData.triggerSave(); 
                            }
                        });
                    }
                }

                const permEl = document.getElementById(`quill-perm-editor-${type}`);
                if (permEl) {
                    permEl.__quill = new Quill(permEl, { theme: 'snow', modules: { toolbar: tOpts }, placeholder: 'Scrivi qui le informazioni chiave permanenti...' });
                    permEl.__quill.root.innerHTML = entity.permanentNotes || '';
                    permEl.__quill.on('text-change', function(delta, oldDelta, source) { 
                        if (source === 'user') {
                            entity.permanentNotes = permEl.__quill.root.innerHTML; 
                            AppData.triggerSave(); 
                        }
                    });
                }
            });
        }

        function togglePin(type, id) { 
            const e = getEntity(type, id);
            if(e) { e.pinned = !e.pinned; AppData.triggerSave(); render(); }
        }
        function toggleArchiveEntity(type, id) { 
            const e = getEntity(type, id);
            if(e) { e.archived = !e.archived; AppData.triggerSave(); render(); }
        }

        // --- TASKS ---
        function getContextInfo(cId) {
            if(!cId) return {name: 'Inbox', color: '#94a3b8'};
            let s = getEntity('sphere', cId); if(s) return {name: s.name, color: s.color};
            let p = getEntity('project', cId); if(p) { let ps = getEntity('sphere', p.sphereId); return {name: p.name, color: p.color || (ps?ps.color:'#94a3b8')}; }
            let sp = getEntity('subproject', cId); 
            if(sp) {
                let pp = getEntity('project', sp.projectId);
                let ps = pp ? getEntity('sphere', pp.sphereId) : null;
                return {name: sp.name, color: sp.color || (pp?pp.color:null) || (ps?ps.color:'#94a3b8')};
            }
            return {name: 'Sconosciuto', color: '#94a3b8'};
        }

        function generateCtxOpts(selectedId) {
            let opts = `<option value="">📥 Inbox (Nessun contesto)</option>`;
            state.data.spheres.forEach(s => {
                opts += `<optgroup label="Sfera: ${s.name}">`;
                opts += `<option value="${s.id}" ${s.id===selectedId?'selected':''}>● Sfera: ${s.name}</option>`;
                state.data.projects.filter(p=>p.sphereId===s.id).forEach(p => {
                    opts += `<option value="${p.id}" ${p.id===selectedId?'selected':''}>  📁 ${p.name}</option>`;
                    state.data.subprojects.filter(sp=>sp.projectId===p.id).forEach(sp => { 
                        opts += `<option value="${sp.id}" ${sp.id===selectedId?'selected':''}>    ↳ 📄 ${sp.name}</option>`; 
                    });
                });
                opts += `</optgroup>`;
            });
            return opts;
        }

        function renderInlineTasks(contextId, showGlobal=false, showCompletedOption=true) {
            let tasks = contextId ? state.data.tasks.filter(t => t.contextId === contextId) : [...state.data.tasks];
            const hasCompleted = tasks.some(t => t.completed);
            if(!state.ui.showCompletedTasks) tasks = tasks.filter(t => !t.completed);
            tasks.sort((a,b) => a.completed - b.completed || b.priority - a.priority);

            let html = `
                <div class="flex gap-2 mb-4">
                    <input type="text" id="tIn_${contextId||'g'}" class="input-base flex-1 font-semibold text-sm py-1.5" placeholder="Nuovo task..." onkeypress="if(event.key === 'Enter') addTask('${contextId||''}')">
                    <button onclick="addTask('${contextId||''}')" class="bg-blue-600 hover:bg-blue-700 px-3 rounded text-white transition shadow-sm"><i class="fas fa-plus text-xs"></i></button>
                </div>
                <div class="space-y-1.5 max-h-[300px] overflow-y-auto pr-1">`;
            
            if(tasks.length === 0) html += `<p class="text-xs text-slate-400 text-center py-3 italic">Nessun task attivo.</p>`;
            
            tasks.forEach(t => {
                const ctx = getContextInfo(t.contextId);
                if (editingTaskId === t.id) {
                    html += `
                        <div class="flex flex-col gap-2 p-3 bg-slate-100 dark:bg-slate-800 rounded border border-slate-300 dark:border-slate-600 shadow-inner">
                            <input type="text" id="etTitle_${t.id}" value="${t.title}" class="input-base font-bold text-sm py-1">
                            <div class="flex flex-wrap gap-2">
                                <select id="etPri_${t.id}" class="input-base w-16 text-xs font-bold py-1"><option value="0" ${t.priority===0?'selected':''}>P0</option><option value="1" ${t.priority===1?'selected':''}>P1</option><option value="2" ${t.priority===2?'selected':''}>P2</option><option value="3" ${t.priority===3?'selected':''}>P3</option></select>
                                <input type="date" id="etDate_${t.id}" value="${t.dueDate||''}" class="input-base w-32 text-xs font-bold py-1">
                                ${showGlobal ? `<select id="etCtx_${t.id}" class="input-base flex-1 min-w-[120px] text-xs font-bold py-1">${generateCtxOpts(t.contextId)}</select>` : ''}
                            </div>
                            <div class="flex justify-end gap-2 mt-1">
                                <button onclick="editingTaskId=null; render()" class="text-[10px] font-bold px-2 py-1 rounded text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition">Annulla</button>
                                <button onclick="saveTaskEdit('${t.id}', ${showGlobal ? `'etCtx_${t.id}'` : 'null'})" class="text-[10px] font-bold px-3 py-1 rounded bg-blue-600 text-white hover:bg-blue-700 shadow-sm transition">Salva</button>
                            </div>
                        </div>`;
                } else {
                    html += `
                        <div class="panel p-2.5 flex items-center gap-2.5 prio-${t.priority} bg-slate-50 dark:bg-[#202938] border border-slate-200 dark:border-darkborder rounded-md hover:shadow-sm transition group border-l-4" style="border-left-color: ${t.priority>0 ? '' : 'transparent'}">
                            <input type="checkbox" class="task-checkbox shrink-0 h-4 w-4 mt-0" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t.id}')">
                            <div class="flex-1 min-w-0 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                <p class="${t.completed ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-200'} text-sm font-semibold word-wrap leading-tight">${t.title}</p>
                                <div class="flex items-center gap-2 shrink-0">
                                    ${showGlobal && t.contextId ? `<span class="text-[9px] uppercase font-bold tracking-wider truncate px-1.5 py-0.5 rounded border" style="color:${ctx.color}; border-color:${ctx.color}40; background-color:${ctx.color}10">${ctx.name}</span>` : ''}
                                    ${t.dueDate ? `<span class="text-[9px] text-slate-500 dark:text-slate-400 font-bold"><i class="far fa-calendar mr-1"></i>${t.dueDate}</span>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                                <button class="text-slate-400 hover:text-blue-500 text-[10px] p-1.5" onclick="editTask('${t.id}')"><i class="fas fa-edit"></i></button>
                                <button class="text-slate-400 hover:text-red-500 text-[10px] p-1.5" onclick="deleteTask('${t.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>`;
                }
            });

            if(showCompletedOption && hasCompleted) {
                html += `<div class="mt-4 text-center border-t border-slate-200 dark:border-darkborder pt-3"><button onclick="state.ui.showCompletedTasks = !state.ui.showCompletedTasks; render();" class="text-[10px] font-bold text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white transition">${state.ui.showCompletedTasks ? 'Nascondi completati' : 'Mostra completati'}</button></div>`;
            }
            return html + `</div>`;
        }

        // --- TASK MANAGER (ADVANCED) ---
        function toggleTmSidebar() {
            const sidebar = document.getElementById('tmSidebar');
            const overlay = document.getElementById('tmOverlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.remove('open');
            } else {
                sidebar.classList.add('open');
                overlay.classList.add('open');
            }
        }

        function setListSetting(key, value) {
            const listId = state.ui.tmView;
            if(!tmListSettings[listId]) tmListSettings[listId] = { groupBy: 'priority', sortBy: 'priority' };
            tmListSettings[listId][key] = value;
            localStorage.setItem('hub_tm_settings', JSON.stringify(tmListSettings));
            render();
        }

        function renderAdvancedTaskManager() {
            // Sidebar Navigation (Identico nei dati, nuovo nel look per somigliare alla reference)
            let navHtml = `
                <div class="mb-6 space-y-1 mt-4 md:mt-0 px-2 md:px-0">
                    <div class="tm-nav-item ${state.ui.tmView==='all'?'active':''}" onclick="state.ui.tmView='all'; toggleTmSidebar(); render();"><i class="fas fa-inbox w-4 text-blue-500"></i> Posta in arrivo</div>
                    <div class="tm-nav-item ${state.ui.tmView==='today'?'active':''}" onclick="state.ui.tmView='today'; toggleTmSidebar(); render();"><i class="fas fa-calendar-day w-4 text-amber-500"></i> Oggi</div>
                </div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-4 md:px-2 border-t border-slate-200 dark:border-slate-700 pt-4">Le Tue Liste</div>
                <div class="space-y-1 max-h-[60vh] overflow-y-auto px-2 md:px-0 pb-20">`;
            
            state.data.spheres.sort((a,b)=>(a.order||0)-(b.order||0)).forEach(s => {
                navHtml += `<div class="mb-2">
                            <div class="flex items-center group"><i class="fas fa-chevron-down text-[10px] text-slate-400 cursor-pointer w-6 text-center hover:text-slate-800 dark:hover:text-white transition" onclick="toggleNavFolder(event, 'nav_s_${s.id}')"></i><div class="tm-nav-item flex-1 ${state.ui.tmView==='s_'+s.id?'active':''}" onclick="state.ui.tmView='s_${s.id}'; toggleTmSidebar(); render();" style="color: ${state.ui.tmView==='s_'+s.id ? s.color : ''}"><i class="fas ${s.icon} w-4" style="color:${s.color}"></i> ${s.name}</div></div>
                            <div id="nav_s_${s.id}" class="pl-2 ml-3 mt-1 mb-2 space-y-1">`;
                
                getChildren('sphere', s.id).filter(p=>!p.archived).forEach(p => {
                    const subs = getChildren('project', p.id).filter(sp=>!sp.archived);
                    navHtml += `<div>`;
                    if(subs.length > 0) {
                        navHtml += `<div class="flex items-center group"><i class="fas fa-chevron-down text-[9px] text-slate-400 cursor-pointer w-6 text-center hover:text-slate-800 dark:hover:text-white transition" onclick="toggleNavFolder(event, 'nav_p_${p.id}')"></i><div class="tm-nav-item flex-1 text-sm ${state.ui.tmView==='p_'+p.id?'active':''}" onclick="state.ui.tmView='p_${p.id}'; toggleTmSidebar(); render();"><i class="fas ${p.icon||'fa-folder'} w-4 text-slate-400"></i> ${p.name}</div></div>`;
                        navHtml += `<div id="nav_p_${p.id}" class="pl-2 ml-3 mt-1 space-y-1">`;
                        subs.forEach(sp => {
                            navHtml += `<div class="flex items-center ml-1"><div class="tm-nav-item flex-1 text-xs ${state.ui.tmView==='sp_'+sp.id?'active':''}" onclick="state.ui.tmView='sp_'+sp.id'; toggleTmSidebar(); render();"><i class="fas ${sp.icon||'fa-file-alt'} w-4 text-slate-400"></i> ${sp.name}</div></div>`;
                        });
                        navHtml += `</div>`;
                    } else {
                        navHtml += `<div class="flex items-center group"><div class="w-6"></div><div class="tm-nav-item flex-1 text-sm ${state.ui.tmView==='p_'+p.id?'active':''}" onclick="state.ui.tmView='p_${p.id}'; toggleTmSidebar(); render();"><i class="fas ${p.icon||'fa-folder'} w-4 text-slate-400"></i> ${p.name}</div></div>`;
                    }
                    navHtml += `</div>`;
                });
                navHtml += `</div></div>`;
            });
            navHtml += `</div>`;

            let currentCtxId = "";
            if(state.ui.tmView.startsWith('s_')) currentCtxId = state.ui.tmView.replace('s_','');
            else if(state.ui.tmView.startsWith('p_')) currentCtxId = state.ui.tmView.replace('p_','');
            else if(state.ui.tmView.startsWith('sp_')) currentCtxId = state.ui.tmView.replace('sp_','');

            let ctxOpts = generateCtxOpts(currentCtxId);
            let tasks = [...state.data.tasks];
            const todayStr = new Date().toISOString().split('T')[0];
            let listTitle = "Posta in arrivo";

            if(state.ui.tmView === 'today') { tasks = tasks.filter(t => t.dueDate === todayStr); listTitle = "Oggi"; }
            else if(state.ui.tmView === 'inbox') { tasks = tasks.filter(t => !t.contextId); listTitle = "Senza Contesto"; }
            else if(state.ui.tmView === 'all') { listTitle = "Posta in arrivo"; }
            else if(state.ui.tmView.startsWith('s_')) { 
                const id = state.ui.tmView.replace('s_',''); 
                tasks = tasks.filter(t => {
                    if(t.contextId === id) return true;
                    let p = getEntity('project', t.contextId);
                    if(p && p.sphereId === id) return true;
                    let sp = getEntity('subproject', t.contextId);
                    if(sp) { let pp = getEntity('project', sp.projectId); if(pp && pp.sphereId === id) return true; }
                    return false;
                }); 
                let sObj = getEntity('sphere', id); listTitle = sObj ? sObj.name : 'Lista'; 
            }
            else if(state.ui.tmView.startsWith('p_')) { 
                const id = state.ui.tmView.replace('p_',''); 
                tasks = tasks.filter(t => t.contextId === id || (getEntity('subproject', t.contextId)?.projectId === id)); 
                let pObj = getEntity('project', id); listTitle = pObj ? pObj.name : 'Lista'; 
            }
            else if(state.ui.tmView.startsWith('sp_')) { 
                const id = state.ui.tmView.replace('sp_',''); 
                tasks = tasks.filter(t => t.contextId === id); 
                let spObj = getEntity('subproject', id); listTitle = spObj ? spObj.name : 'Lista'; 
            }

            // Impostazioni specifiche per questa lista
            const listConf = tmListSettings[state.ui.tmView] || { groupBy: 'priority', sortBy: 'priority' };

            // Filtraggio base
            const hasCompleted = tasks.some(t => t.completed);
            if(!state.ui.showCompletedTasks) tasks = tasks.filter(t => !t.completed);

            // Ordinamento basato sulle preferenze della lista
            tasks.sort((a,b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;
                if(listConf.sortBy === 'priority') return b.priority - a.priority;
                if(listConf.sortBy === 'date') return (a.dueDate || '9999-12-31').localeCompare(b.dueDate || '9999-12-31');
                if(listConf.sortBy === 'name') return a.title.localeCompare(b.title);
                return 0;
            });

            // Logica Raggruppamento (Grouping)
            let groups = {};
            if(listConf.groupBy === 'priority') {
                groups = { "Alta": [], "Media": [], "Bassa": [], "Nessuna": [] };
                tasks.forEach(t => {
                    if(t.priority === 3) groups["Alta"].push(t);
                    else if(t.priority === 2) groups["Media"].push(t);
                    else if(t.priority === 1) groups["Bassa"].push(t);
                    else groups["Nessuna"].push(t);
                });
            } else if (listConf.groupBy === 'date') {
                groups = { "Oggi": [], "Prossimamente": [], "Senza Data": [] };
                tasks.forEach(t => {
                    if(!t.dueDate) groups["Senza Data"].push(t);
                    else if(t.dueDate === todayStr) groups["Oggi"].push(t);
                    else groups["Prossimamente"].push(t);
                });
            } else if (listConf.groupBy === 'none') {
                groups = { "": tasks }; // Un unico gruppo senza titolo
            }

            // Renderizzazione Task HTML
            let tasksHtml = '';
            if(tasks.length === 0) tasksHtml = `<div class="text-center py-16 text-slate-400"><i class="fas fa-clipboard-check text-5xl mb-4 opacity-20"></i><p class="font-bold text-sm">Tutto completato per ora!</p></div>`;
            else {
                for (const [groupName, groupTasks] of Object.entries(groups)) {
                    if(groupTasks.length === 0) continue;
                    
                    let groupColor = "text-slate-500";
                    if(groupName === "Alta") groupColor = "text-red-500";
                    if(groupName === "Media") groupColor = "text-amber-500";
                    if(groupName === "Bassa") groupColor = "text-blue-500";

                    if(groupName !== "") {
                        tasksHtml += `<div class="flex justify-between items-center px-1 mb-2 mt-4"><h3 class="text-xs font-bold ${groupColor}">${groupName}</h3><span class="text-[10px] text-slate-400 font-bold">${groupTasks.length}</span></div>`;
                    }
                    
                    tasksHtml += `<div class="bg-white dark:bg-darkpanel rounded-2xl shadow-sm border border-slate-100 dark:border-darkborder overflow-hidden mb-4">`;
                    
                    groupTasks.forEach((t, idx) => {
                        const ctx = getContextInfo(t.contextId);
                        const isLast = idx === groupTasks.length - 1;
                        const borderBottom = isLast ? '' : 'border-b border-slate-100 dark:border-slate-700/50';
                        
                        if (editingTaskId === t.id) {
                            tasksHtml += `
                                <div class="p-3 bg-slate-50 dark:bg-[#1a1c23] ${borderBottom} flex flex-col gap-3">
                                    <input type="text" id="etTitle_${t.id}" value="${t.title}" class="input-base font-bold text-sm py-1.5">
                                    <div class="flex flex-wrap items-center gap-2">
                                        <select id="etPri_${t.id}" class="input-base w-24 text-[10px] font-bold py-1.5"><option value="0" ${t.priority===0?'selected':''}>No Prio</option><option value="1" ${t.priority===1?'selected':''}>Bassa</option><option value="2" ${t.priority===2?'selected':''}>Media</option><option value="3" ${t.priority===3?'selected':''}>Alta</option></select>
                                        <input type="date" id="etDate_${t.id}" value="${t.dueDate||''}" class="input-base w-28 text-[10px] font-bold py-1.5">
                                        <select id="etCtx_${t.id}" class="input-base flex-1 min-w-[120px] text-[10px] font-bold py-1.5">${generateCtxOpts(t.contextId)}</select>
                                    </div>
                                    <div class="flex justify-end gap-2 mt-1">
                                        <button onclick="editingTaskId=null; render()" class="text-[10px] font-bold px-3 py-1.5 rounded text-slate-500 hover:text-slate-800 transition">Annulla</button>
                                        <button onclick="saveTaskEdit('${t.id}', 'etCtx_${t.id}')" class="text-[10px] font-bold px-4 py-1.5 rounded bg-blue-600 text-white shadow-sm transition">Salva</button>
                                    </div>
                                </div>`;
                        } else {
                            // Checkbox color in base alla priorità nello screen
                            let cbClass = "";
                            if(t.priority === 3) cbClass = "border-red-400 checked:bg-red-500 checked:border-red-500";
                            else if(t.priority === 2) cbClass = "border-amber-400 checked:bg-amber-500 checked:border-amber-500";
                            else if(t.priority === 1) cbClass = "border-blue-400 checked:bg-blue-500 checked:border-blue-500";

                            tasksHtml += `
                                <div class="p-3.5 flex items-start gap-3 ${borderBottom} group hover:bg-slate-50 dark:hover:bg-[#202938] transition">
                                    <input type="checkbox" class="task-checkbox mt-0.5 shrink-0 ${cbClass}" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t.id}')">
                                    <div class="flex-1 min-w-0">
                                        <p class="${t.completed ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200'} text-[15px] font-medium word-wrap leading-tight mb-1">${t.title}</p>
                                        <div class="flex items-center gap-3">
                                            ${t.dueDate ? `<span class="text-[10px] text-slate-400 font-bold"><i class="far fa-calendar mr-1"></i>${t.dueDate}</span>` : ''}
                                            ${t.contextId && state.ui.tmView === 'all' ? `<span class="text-[9px] text-slate-400 font-bold truncate"><i class="fas fa-folder mr-1 opacity-50"></i>${ctx.name}</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition">
                                        <button onclick="editTask('${t.id}')" class="text-slate-300 hover:text-blue-500 p-1"><i class="fas fa-edit text-xs"></i></button>
                                        <button onclick="deleteTask('${t.id}')" class="text-slate-300 hover:text-red-500 p-1"><i class="fas fa-trash-alt text-xs"></i></button>
                                    </div>
                                </div>`;
                        }
                    });
                    tasksHtml += `</div>`;
                }
            }

            if(hasCompleted) {
                tasksHtml += `<div class="mt-8 text-center pb-4"><button onclick="state.ui.showCompletedTasks = !state.ui.showCompletedTasks; render();" class="text-[10px] font-bold text-slate-400 hover:text-slate-600 transition bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-full shadow-sm">${state.ui.showCompletedTasks ? 'Nascondi completati' : 'Mostra completati'}</button></div>`;
            }

            // Costruzione layout finale Task Manager
            return `
                <div class="fixed inset-0 top-[60px] md:top-auto md:relative flex overflow-hidden bg-slate-50 dark:bg-darkbg md:rounded-xl md:border border-slate-200 dark:border-darkborder md:shadow-xl md:min-h-[85vh]">
                    
                    <!-- SIDEBAR -->
                    <div id="tmSidebar" class="tm-sidebar-mobile bg-[#eff4f9] dark:bg-[#13151a] md:border-r border-slate-200 dark:border-darkborder md:p-4 shrink-0 overflow-y-auto">
                        <!-- Intestazione User Reference 2 -->
                        <div class="flex items-center gap-3 p-4 mb-2 md:hidden">
                            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg"><i class="fas fa-user-circle"></i></div>
                            <div class="font-bold text-slate-800 dark:text-white flex-1">Menu Liste</div>
                            <button onclick="toggleTmSidebar()" class="p-2 text-slate-400"><i class="fas fa-times text-lg"></i></button>
                        </div>
                        ${navHtml}
                    </div>

                    <!-- MAIN AREA -->
                    <div class="flex-1 flex flex-col bg-[#fdfaf5] dark:bg-darkpanel overflow-hidden w-full relative">
                        
                        <!-- HEADER MOBILE (Hamburger & Titolo) -->
                        <div class="flex items-center justify-between p-4 md:px-8 md:pt-8 bg-transparent z-10 shrink-0">
                            <div class="flex items-center gap-3">
                                <button onclick="toggleTmSidebar()" class="md:hidden text-slate-600 dark:text-slate-300 text-xl p-1"><i class="fas fa-bars"></i></button>
                                <h2 class="text-xl md:text-2xl font-bold text-slate-800 dark:text-slate-100 tracking-tight flex items-center"><i class="far fa-clipboard text-slate-400 mr-2"></i> ${listTitle}</h2>
                            </div>
                            
                            <!-- MENU IMPOSTAZIONI LISTA (Raggruppa/Ordina) -->
                            <div class="relative group">
                                <button class="text-slate-500 hover:text-slate-800 p-2 text-lg"><i class="fas fa-ellipsis-v"></i></button>
                                <div class="absolute right-0 mt-1 w-48 bg-white dark:bg-slate-800 rounded-lg shadow-xl border border-slate-100 dark:border-slate-700 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 p-2">
                                    <div class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-2 mb-1">Raggruppa per</div>
                                    <select class="input-base text-xs font-bold mb-3" onchange="setListSetting('groupBy', this.value)">
                                        <option value="none" ${listConf.groupBy==='none'?'selected':''}>Nessuno</option>
                                        <option value="priority" ${listConf.groupBy==='priority'?'selected':''}>Priorità</option>
                                        <option value="date" ${listConf.groupBy==='date'?'selected':''}>Data</option>
                                    </select>
                                    <div class="text-[9px] font-bold text-slate-400 uppercase tracking-widest px-2 mb-1">Ordina per</div>
                                    <select class="input-base text-xs font-bold" onchange="setListSetting('sortBy', this.value)">
                                        <option value="priority" ${listConf.sortBy==='priority'?'selected':''}>Priorità</option>
                                        <option value="date" ${listConf.sortBy==='date'?'selected':''}>Data</option>
                                        <option value="name" ${listConf.sortBy==='name'?'selected':''}>Nome</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- LISTA TASKS SCROLLABILE -->
                        <div class="flex-1 overflow-y-auto px-4 md:px-8 pb-24">
                            ${tasksHtml}
                        </div>

                        <!-- FLOATING ACTION BUTTON (Mobile Insert) -->
                        <div class="absolute bottom-6 right-6 md:hidden">
                            <button onclick="document.getElementById('quickAddBar').classList.toggle('hidden'); document.getElementById('gtIn').focus();" class="w-14 h-14 bg-amber-500 hover:bg-amber-600 rounded-full text-white text-2xl shadow-lg flex items-center justify-center transition-transform hover:scale-105 z-20">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>

                        <!-- BARRA INSERIMENTO RAPIDO -->
                        <div id="quickAddBar" class="hidden md:flex absolute md:relative bottom-0 left-0 right-0 bg-white dark:bg-slate-800 p-3 md:p-6 border-t border-slate-200 dark:border-slate-700 flex-col md:flex-row gap-2 z-10 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
                            <input type="text" id="gtIn" class="input-base flex-1 min-w-[200px] font-semibold text-sm py-2" placeholder="Scrivi nuovo task..." onkeypress="if(event.key==='Enter') addTaskFromGlobal()">
                            <div class="flex gap-2">
                                <select id="gtPri" class="input-base w-24 text-[10px] font-bold py-2"><option value="0">No Prio</option><option value="1">Bassa</option><option value="2">Media</option><option value="3">Alta</option></select>
                                <input type="date" id="gtDate" class="input-base w-[100px] text-[10px] font-bold py-2">
                                <select id="gtCtx" class="input-base hidden md:block w-32 text-[10px] font-bold py-2">${ctxOpts}</select>
                                <button onclick="addTaskFromGlobal()" class="bg-amber-500 hover:bg-amber-600 px-4 py-2 rounded-lg text-white font-bold shadow transition"><i class="fas fa-arrow-up"></i></button>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function addTask(cId) {
            const tIn = document.getElementById(`tIn_${cId||'g'}`);
            if(!tIn.value.trim()) return;
            state.data.tasks.push({ id: 't_'+Date.now(), title: tIn.value.trim(), completed: false, priority: 0, dueDate: '', contextId: cId || '' });
            AppData.triggerSave(); render();
        }
        function addTaskFromGlobal() {
            const tIn = document.getElementById('gtIn'), pIn = document.getElementById('gtPri'), dIn = document.getElementById('gtDate');
            const cIn = document.getElementById('gtCtx'); // Potrebbe essere undefined su mobile se nascosto
            const ctxValue = cIn ? cIn.value : (state.ui.tmView.startsWith('p_') || state.ui.tmView.startsWith('sp_') || state.ui.tmView.startsWith('s_') ? state.ui.tmView.replace(/^[ps_]+/, '') : '');
            
            if(!tIn.value.trim()) return;
            state.data.tasks.push({ id: 't_'+Date.now(), title: tIn.value.trim(), completed: false, priority: parseInt(pIn.value), dueDate: dIn.value, contextId: ctxValue });
            
            tIn.value = ''; // Pulisci input dopo l'invio
            if(window.innerWidth < 768) document.getElementById('quickAddBar').classList.add('hidden'); // Chiudi barra su mobile
            AppData.triggerSave(); render();
        }
        function toggleTask(id) { const t = state.data.tasks.find(x => x.id === id); if(t) t.completed = !t.completed; AppData.triggerSave(); render(); }
        function deleteTask(id) { state.data.tasks = state.data.tasks.filter(x => x.id !== id); AppData.triggerSave(); render(); }
        
        function editTask(id) { editingTaskId = id; render(); }
        function saveTaskEdit(id, contextElementId) {
            const t = state.data.tasks.find(x => x.id === id);
            if(!t) return;
            const titleInput = document.getElementById('etTitle_' + id);
            if(titleInput.value.trim()) t.title = titleInput.value.trim();
            t.priority = parseInt(document.getElementById('etPri_' + id).value);
            t.dueDate = document.getElementById('etDate_' + id).value;
            if(contextElementId) { t.contextId = document.getElementById(contextElementId).value; }
            editingTaskId = null;
            AppData.triggerSave(); render();
        }

        // --- RUBRICA ---
        function renderGlobalContacts() {
            let html = `
                <div class="flex justify-between items-center mb-8 pb-5 border-b border-slate-200 dark:border-darkborder">
                    <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100 flex items-center tracking-tight"><i class="fas fa-address-book text-slate-400 dark:text-slate-500 mr-3"></i> Rubrica Globale</h2>
                    <button onclick="openContactModal()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white text-sm font-bold shadow transition"><i class="fas fa-plus mr-1.5"></i> Nuovo Contatto</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">`;
            if(state.data.contacts.length===0) html += `<p class="text-sm text-slate-500 col-span-full italic">Rubrica vuota.</p>`;
            state.data.contacts.forEach(c => {
                html += `
                    <div class="panel p-5 flex flex-col gap-4 relative group bg-white dark:bg-darkpanel border border-slate-200 dark:border-darkborder shadow hover:shadow-md transition">
                        <button onclick="openContactModal('${c.id}')" class="absolute top-3 right-3 text-slate-400 hover:text-blue-500 opacity-0 group-hover:opacity-100 transition p-1.5 rounded hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fas fa-edit"></i></button>
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 text-xl shadow-inner border border-slate-200 dark:border-slate-700"><i class="fas fa-user"></i></div>
                            <div class="min-w-0 flex-1">
                                <p class="text-base font-bold text-slate-900 dark:text-slate-100 truncate">${c.name}</p>
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider truncate mt-0.5">${c.role} ${c.org ? ` • ${c.org}` : ''}</p>
                            </div>
                        </div>
                        <div class="text-xs font-medium text-slate-600 dark:text-slate-400 space-y-1.5 p-3 rounded-lg border border-slate-200 dark:border-darkborder bg-slate-50 dark:bg-[#202938]">
                            ${c.phone ? `<p class="flex items-center"><i class="fas fa-phone mr-2 text-slate-400"></i> ${c.phone}</p>` : ''}
                            ${c.email ? `<p class="flex items-center"><i class="fas fa-envelope mr-2 text-slate-400"></i> <a href="mailto:${c.email}" class="hover:text-blue-500 transition">${c.email}</a></p>` : ''}
                            ${!c.phone && !c.email ? '<p class="italic text-[10px] opacity-50">Nessun recapito</p>' : ''}
                        </div>
                    </div>`;
            });
            return html + `</div>`;
        }

        function renderContextContacts(cId) {
            const contacts = state.data.contacts.filter(c => c.contextIds && c.contextIds.includes(cId));
            const availableToLink = state.data.contacts.filter(c => !(c.contextIds && c.contextIds.includes(cId)));
            
            let html = `
                <div class="flex gap-2 mb-4">
                    <select id="linkContact_${cId}" class="input-base text-[10px] font-bold py-1.5 flex-1">
                        <option value="">Collega dalla rubrica...</option>
                        ${availableToLink.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                    </select>
                    <button onclick="linkExistingContact('${cId}')" class="bg-blue-600 hover:bg-blue-700 px-3 rounded text-white text-[10px] font-bold shadow-sm transition"><i class="fas fa-link"></i></button>
                </div>
                <div class="space-y-2">`;
            if(contacts.length===0) html += `<p class="text-[10px] text-slate-500 italic">Nessun contatto collegato.</p>`;
            
            contacts.forEach(c => {
                html += `
                    <div class="p-3 bg-slate-50 dark:bg-[#202938] border border-slate-200 dark:border-darkborder rounded relative group shadow-sm">
                        <div class="flex items-center gap-2 mb-2 cursor-pointer" onclick="openContactModal('${c.id}')">
                            <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-500 shrink-0"><i class="fas fa-user text-xs"></i></div>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate">${c.name}</p>
                                <p class="text-[9px] text-slate-500 font-bold truncate uppercase tracking-widest mt-0.5">${c.role}</p>
                            </div>
                        </div>
                        <div class="text-[10px] font-bold text-slate-500 mt-1 pl-10 space-y-1">
                            ${c.phone ? `<div class="flex items-center"><i class="fas fa-phone mr-1.5"></i> ${c.phone}</div>` : ''}
                            ${c.email ? `<div class="flex items-center"><i class="fas fa-envelope mr-1.5"></i> <a href="mailto:${c.email}" class="hover:text-blue-500 transition" onclick="event.stopPropagation()">${c.email}</a></div>` : ''}
                        </div>
                        <button onclick="unlinkContact('${c.id}', '${cId}')" class="absolute top-2 right-2 text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-700" title="Scollega dal progetto"><i class="fas fa-unlink text-[10px]"></i></button>
                    </div>`;
            });
            return html + `</div>`;
        }

        function linkExistingContact(cId) {
            const select = document.getElementById('linkContact_' + cId);
            if(!select.value) return;
            const c = state.data.contacts.find(x => x.id === select.value);
            if(c && (!c.contextIds || !c.contextIds.includes(cId))) {
                if(!c.contextIds) c.contextIds = [];
                c.contextIds.push(cId);
                AppData.triggerSave(); render();
            }
        }
        function unlinkContact(contactId, cId) {
            const c = state.data.contacts.find(x => x.id === contactId);
            if(c) { c.contextIds = c.contextIds.filter(id => id !== cId); AppData.triggerSave(); render(); }
        }

        function openContactModal(cId=null, linkCtx=null) {
            contactEditId = cId;
            document.getElementById('contactModal').classList.remove('hidden');
            const btnDel = document.getElementById('cmDeleteBtn');
            if(cId) {
                const c = state.data.contacts.find(x => x.id === cId);
                if(!c) return;
                document.getElementById('cmTitle').innerText = 'Modifica Contatto';
                document.getElementById('cmName').value = c.name; document.getElementById('cmRole').value = c.role;
                document.getElementById('cmOrg').value = c.org || ''; document.getElementById('cmPhone').value = c.phone || ''; document.getElementById('cmEmail').value = c.email || '';
                btnDel.classList.remove('hidden');
            } else {
                document.getElementById('cmTitle').innerText = 'Nuovo Contatto';
                ['cmName','cmRole','cmOrg','cmPhone','cmEmail'].forEach(id => document.getElementById(id).value = '');
                btnDel.classList.add('hidden');
            }
            localStorage.setItem('temp_ctx_link', linkCtx || '');
        }
        function closeContactModal() { document.getElementById('contactModal').classList.add('hidden'); }
        function saveContact() {
            const name = document.getElementById('cmName').value.trim(); if(!name) return alert("Inserisci il nome");
            const payload = { name, role: document.getElementById('cmRole').value, org: document.getElementById('cmOrg').value, phone: document.getElementById('cmPhone').value, email: document.getElementById('cmEmail').value };
            if(contactEditId) { 
                let obj = state.data.contacts.find(x => x.id === contactEditId);
                if(obj) Object.assign(obj, payload); 
            } else {
                const ctxLink = localStorage.getItem('temp_ctx_link');
                state.data.contacts.push({ id: 'c_'+Date.now(), ...payload, contextIds: ctxLink ? [ctxLink] : [] });
            }
            closeContactModal(); AppData.triggerSave(); render();
        }
        function deleteContact() { if(confirm("Eliminare definitivamente?")) { state.data.contacts = state.data.contacts.filter(x => x.id !== contactEditId); closeContactModal(); AppData.triggerSave(); render(); } }

        // --- TIMELINE ---
        function renderTimeline() {
            let html = `<div class="panel p-6 max-w-5xl mx-auto min-h-[80vh] overflow-x-auto bg-white dark:bg-darkpanel border border-slate-200 dark:border-darkborder shadow-xl"><h2 class="text-2xl font-bold mb-6 text-slate-800 dark:text-slate-100 flex items-center tracking-tight"><i class="fas fa-stream text-slate-400 mr-3"></i> Timeline</h2><p class="text-xs font-medium text-slate-500 mb-8 border-b border-slate-200 dark:border-darkborder pb-4">Imposta Data Inizio e Fine nei progetti e sottoprogetti per visualizzarli qui.</p><div class="min-w-[800px]">`;
            const entities = [...state.data.projects, ...state.data.subprojects].filter(e => e.startDate && e.endDate && !e.archived).sort((a,b) => new Date(a.startDate) - new Date(b.startDate));
            if(entities.length === 0) html += `<p class="text-slate-500 text-center mt-10 font-bold text-sm opacity-50">Nessun elemento con date impostate.</p>`;
            entities.forEach(p => {
                const isProj = !!p.sphereId;
                const parent = isProj ? getEntity('sphere', p.sphereId) : getEntity('project', p.projectId);
                const parentName = parent ? parent.name : 'Sconosciuto';
                let color = p.color;
                if (!color && parent) {
                    if (isProj) color = parent.color;
                    else {
                        const grandParent = getEntity('sphere', parent.sphereId);
                        color = parent.color || (grandParent ? grandParent.color : '#94a3b8');
                    }
                }
                color = color || '#94a3b8';
                
                html += `<div class="flex items-center gap-4 mb-4 group">
                    <div class="w-48 truncate text-xs font-bold text-slate-800 dark:text-slate-200" title="${p.name}"><span class="text-[9px] text-slate-500 uppercase tracking-widest block truncate mb-0.5">${parentName}</span>${p.name}</div>
                    <div class="flex-1 bg-slate-100 dark:bg-slate-800 h-8 rounded relative border border-slate-200 dark:border-slate-700 overflow-hidden shadow-inner">
                        <div class="absolute top-0 bottom-0 left-0 rounded flex items-center px-3 text-[10px] text-white truncate font-bold shadow-sm transition-all group-hover:brightness-110" style="left: 10%; right: 40%; background-color: ${color}">${p.startDate} - ${p.endDate}</div>
                    </div>
                </div>`;
            });
            return html + `</div></div>`;
        }

        // AVVIO
        window.onload = () => AppData.initialize();
    </script>
